<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <audio id="bgMusic" loop preload="auto">
    <source src="assets/audio/calm.mp3" type="audio/mpeg">
  </audio>

  <audio id="clickSound" preload="auto">
    <source src="assets/audio/click.mp3" type="audio/mpeg">
  </audio>

  <audio id="winSound" preload="auto">
    <source src="assets/audio/win.wav" type="audio/wav">
  </audio>

  <main id="app">
    <section id="start-screen" aria-labelledby="welcome-title">
      <h1 class="welcome-banner" id="welcome-title">
        <span class="wel">WEL</span><span class="come">COME</span>
      </h1>

      <div class="logo-wrap" aria-label="Tic-Tac-Toe">
        <div class="logo-marks" aria-hidden="true">
          <span class="logo-x">X</span>
          <span class="logo-sep">/</span>
          <span class="logo-o">O</span>
        </div>
        <div class="logo-title">Tic · Tac · Toe</div>
      </div>

      <div class="mode-selector">
        <div class="mode-label">Mode</div>

        <div class="mode-group" aria-label="Game mode">
          <button class="mode-btn active" type="button" data-mode="2p">
            Two Players
          </button>

          <button class="mode-btn" type="button" data-mode="cpu">
            vs CPU
          </button>
        </div>
      </div>

      <button class="start-btn" id="start-btn" type="button">
        Start Game
      </button>
    </section>

    <section id="game-screen" aria-label="Tic-Tac-Toe game">
      <header class="game-header">
        <div class="game-title">Tic · Tac · Toe</div>

        <button class="back-btn" id="back-btn" type="button">
          ← Menu
        </button>
      </header>

      <div class="score-bar" aria-label="Scoreboard">
        <div class="score-card active-x" id="card-x">
          <div class="score-label">
            Player <span class="score-mark x">X</span>
          </div>
          <div class="score-val" id="score-x">0</div>
        </div>

        <div class="score-card score-card-draw">
          <div class="score-label">Draw</div>
          <div class="score-val" id="score-d">0</div>
        </div>

        <div class="score-card" id="card-o">
          <div class="score-label" id="player-o-label">
            Player <span class="score-mark o">O</span>
          </div>
          <div class="score-val" id="score-o">0</div>
        </div>
      </div>

      <p class="status" id="status" aria-live="polite">
        X's turn
      </p>

      <div
        class="board"
        id="board"
        role="grid"
        aria-label="Tic-Tac-Toe board"
      ></div>

      <div class="actions">
        <button class="action-btn" id="restart-btn" type="button">
          Restart
        </button>

        <button class="action-btn" id="reset-score-btn" type="button">
          Reset Score
        </button>

        <button class="action-btn" id="music-btn" type="button">
          🔊 Music ON
        </button>
      </div>
    </section>
  </main>

  <div
    id="result-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="result-title"
  >
    <div class="result-card">
      <div class="result-icon" id="result-icon">X</div>
      <div class="result-title" id="result-title">Player X Wins</div>
      <div class="result-sub" id="result-sub">Well played</div>

      <div class="result-actions">
        <button class="action-btn" id="result-again" type="button">
          Play Again
        </button>

        <button class="action-btn" id="result-menu" type="button">
          Menu
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
